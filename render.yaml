# Render Blueprint for the Sport Team Management Portal (free plan).
# Render -> New -> Blueprint -> pick this repo. It creates both services below.
# The app lives in a sub-folder of this repo, so each service sets rootDir.
services:
  # Express API (Node web service). Free instances sleep after 15 min idle
  # and take ~1 min to wake on the next request.
  - type: web
    name: sport-team-portal-api
    runtime: node
    plan: free
    rootDir: "OneDrive/Desktop/sports team management portal/sport-team-portal/backend"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_DB_NAME
        value: sports_team_portal
      # Secret: Render asks for this when the Blueprint is created.
      - key: MONGODB_URI
        sync: false
      # Frontend address(es) allowed by CORS, comma separated.
      - key: CLIENT_URL
        value: https://sport-team-portal-web.onrender.com

  # React frontend (Vite build served as a static site; static sites are free).
  - type: web
    name: sport-team-portal-web
    runtime: static
    rootDir: "OneDrive/Desktop/sports team management portal/sport-team-portal/frontend"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked in at build time. Change it and redeploy if the API gets a different URL.
      - key: VITE_API_URL
        value: https://sport-team-portal-api.onrender.com/api
    # Send every path to index.html so React Router handles deep links.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
